<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carga masiva IMFOHSA</title>
<style>
body{font-family:Segoe UI,Arial;background:#071526;color:#fff;margin:0;padding:16px}.box{max-width:640px;margin:auto}.card{background:#0d2036;border:1px solid #274c75;border-radius:18px;padding:18px}.logo{background:#fff;border-radius:8px;padding:5px;width:105px}.muted{color:#afc4db;line-height:1.5}.actions{display:grid;gap:10px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#2468d8;color:#fff;font-weight:800;font-size:16px}.secondary{background:#263c56}.send{background:#07864e}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.thumb{position:relative}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:2px solid #355c88}.thumb span{position:absolute;right:4px;bottom:5px;background:#071526dd;border-radius:20px;padding:2px 7px;font-size:11px}.progress{height:9px;background:#203650;border-radius:9px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:#52d692}.ok{color:#65e6a5;font-weight:800}.err{color:#ff8e98}input{position:absolute;left:-9999px}
</style>
</head>
<body><div class="box"><div class="card"><img class="logo" src="/logo-imfohsa.png" onerror="this.style.display='none'"><h2>📚 Listas de despacho</h2><p class="muted">Puede tomar varias fotografías o seleccionar un bloque de imágenes y PDF. Cada página del PDF se convierte en una lista para revisión.</p><div class="actions"><button id="camera">📷 Tomar otra fotografía</button><button id="gallery" class="secondary">📄 Seleccionar fotos / PDF</button><button id="send" class="send" disabled>📤 Enviar lote a Logística</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment"><input id="galleryInput" type="file" accept="image/*,application/pdf,.pdf" multiple><div class="progress"><i id="bar"></i></div><div id="msg" class="muted">0 páginas preparadas.</div><div id="thumbs" class="thumbs"></div></div></div>
<script type="module">
import * as pdfjsLib from './vendor/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='./vendor/pdfjs/pdf.worker.min.mjs';
const sid=(new URLSearchParams(location.search).get('session')||'').trim();let files=[],urls=[],sessionReady=false;const $=s=>document.querySelector(s);
function lockSession(message){sessionReady=false;$('#camera').disabled=true;$('#gallery').disabled=true;$('#send').disabled=true;$('#msg').innerHTML='<span class="err">'+message+'</span>'}
async function validateSession(){if(!sid)return lockSession('Este enlace no contiene una sesión. Genere un enlace nuevo desde el Planificador.');try{let r=await fetch('/api/capture/status?id='+encodeURIComponent(sid),{cache:'no-store'});if(!r.ok)return lockSession('La sesión venció o pertenece a otro servidor. Genere un enlace nuevo desde el Planificador.');let s=await r.json();if(s.Closed||s.closed)return lockSession('Este lote ya fue enviado. Genere un enlace nuevo para otra carga.');sessionReady=true;$('#camera').disabled=false;$('#gallery').disabled=false;$('#send').disabled=!files.length;$('#msg').textContent='Sesión verificada. Puede tomar o seleccionar varias fotografías.'}catch(e){lockSession('No fue posible verificar la sesión. Revise el enlace o la conexión.')}}
function render(){$('#thumbs').innerHTML=files.map((f,i)=>`<div class="thumb"><img src="${URL.createObjectURL(f)}"><span>${i+1}</span></div>`).join('');$('#msg').textContent=`${files.length} fotografía(s) preparadas.`;$('#send').disabled=!sessionReady||!files.length}
async function pdfPages(f){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];for(let n=1;n<=pdf.numPages;n++){let p=await pdf.getPage(n),b=p.getViewport({scale:1}),scale=Math.min(2.4,2200/Math.max(b.width,b.height)),v=p.getViewport({scale}),c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);await p.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:v}).promise;let blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.92));out.push(new File([blob],`${f.name.replace(/\.pdf$/i,'')}_pagina_${n}.jpg`,{type:'image/jpeg'}))}return out}
async function add(list){if(!sessionReady)return lockSession('La sesión no está disponible. Genere un enlace nuevo desde el Planificador.');$('#msg').textContent='Preparando archivos…';try{for(const f of Array.from(list||[])){if(f.type==='application/pdf'||/\.pdf$/i.test(f.name||''))files.push(...await pdfPages(f));else if(f.type.startsWith('image/'))files.push(f)}render()}catch(e){$('#msg').innerHTML='<span class="err">No se pudo abrir el PDF: '+String(e.message||e)+'</span>'}}
$('#camera').onclick=()=>$('#cameraInput').click();$('#gallery').onclick=()=>$('#galleryInput').click();$('#cameraInput').onchange=async e=>{await add(e.target.files);e.target.value=''};$('#galleryInput').onchange=async e=>{await add(e.target.files);e.target.value=''};
async function upload(f,i){let fd=new FormData();fd.append('session',sid);fd.append('file',f,`lista_${String(i+1).padStart(3,'0')}.jpg`);let r=await fetch('/api/capture/upload',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());let j=await r.json();urls=j.urls||urls;$('#bar').style.width=Math.round((i+1)/files.length*100)+'%';$('#msg').textContent=`Enviando ${i+1} de ${files.length}…`}
$('#send').onclick=async()=>{if(!sessionReady)return lockSession('Sesión inválida. Genere un enlace nuevo desde el Planificador.');$('#send').disabled=true;$('#camera').disabled=true;$('#gallery').disabled=true;try{for(let i=0;i<files.length;i++)await upload(files[i],i);let r=await fetch('/api/capture/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:sid})});if(!r.ok)throw new Error(await r.text());$('#msg').innerHTML=`<span class="ok">✓ ${urls.length} fotografías enviadas. La computadora está leyendo y creando las paradas.</span>`}catch(e){$('#msg').innerHTML='<span class="err">No se pudo enviar: '+String(e.message||e)+'</span>';await validateSession();if(sessionReady){$('#send').disabled=false;$('#camera').disabled=false;$('#gallery').disabled=false}}}
validateSession();
</script></body></html>
